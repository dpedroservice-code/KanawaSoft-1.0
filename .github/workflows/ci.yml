name: KanawaSoft CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log('npm audit summary:', JSON.stringify(r.metadata && r.metadata.vulnerabilities || {})); for (const [name, item] of Object.entries(r.vulnerabilities || {})) console.log('npm advisory:', name, 'severity=' + item.severity, 'direct=' + item.isDirect, 'fixAvailable=' + JSON.stringify(item.fixAvailable));"
      - name: Check JavaScript syntax
        run: |
          node --check app/cloud.js
          node --check server/server.js
          node --check server/agt/client.js
          node --check server/agt/jws.js
